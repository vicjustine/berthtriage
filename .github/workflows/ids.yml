name: Get project IDs

on: 
  workflow_dispatch: 

jobs: 
  ids: 
    runs-on: ubuntu-latest
    steps: 
      - name: Resolve the board and its Status options
        env: 
          GH_TOKEN:  ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh api graphql -f query='
            query {
              user(login: "vicjustine") {
                projectV2(number: 2) {
                  id
                  title
                  field(name: "Status") {
                    ... on ProjectV2SingleSelectField {
                      id
                      options { id name }
                      }
                    }
                  }
                }
              }' > ids.json
          jq '.data.user.projectV2.field' ids.json
          echo "PROJECT_ID:   $(jq -r '.data.user.projectV2.id' ids.json)"
          echo "STATUS_FIELD: $(jq -r '.data.user.projectV2.field.id' ids.json)"
          echo ""
          jq -r '.data.user.projectV2.field.options[]
                  | "OPT_" + (.name | ascii_upcase) + ": " + .id' ids.json
                  
                    
